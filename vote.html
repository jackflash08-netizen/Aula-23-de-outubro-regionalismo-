function tx(m){try{conn.send(m)}catch(e){}}
function mapSvg(names){var set={},me=ci();names.forEach(function(n){set[n]=1});var en=me?me[1]:'',mep=null,h='<svg viewBox="0 0 960 500" role="img" aria-label="Mapa-múndi"><path d="'+M.SPH+'" fill="none" stroke="#2a3f5c" stroke-width="1"/>';
M.C.forEach(function(c){if(c[0]===en){mep=c[1];return}h+='<path d="'+c[1]+'" fill="'+(set[c[0]]?'#5bb8c4':'#1e3250')+'" stroke="#0b1522" stroke-width=".4"/>'});
if(mep){h+='<path d="'+mep+'" fill="#f2b63d" stroke="#fff" stroke-width=".8"/>';var best=null,bn=0;mep.split('M').forEach(function(sp){var n=(sp.match(/[-\d.]+,[-\d.]+/g)||[]);if(n.length>bn){bn=n.length;best=n}});
if(best){var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;best.forEach(function(p){var a=p.split(',');x0=Math.min(x0,+a[0]);x1=Math.max(x1,+a[0]);y0=Math.min(y0,+a[1]);y1=Math.max(y1,+a[1])});h+='<circle cx="'+((x0+x1)/2)+'" cy="'+((y0+y1)/2)+'" r="'+(Math.max(9,Math.max(x1-x0,y1-y0)/2+4))+'" fill="none" stroke="#f2b63d" stroke-width="2"/>'}}
return h+'</svg>'}
function tg(t){if(t==='Caso real')t='Fato';return (t==='Fato'||t==='Simulação')?'<span class="tag '+t+'">'+t+'</span>':''}
function anim(k){if(k==='flux')return '<figure><svg viewBox="0 0 300 130" role="img" aria-label="Ilustração: pessoas cruzam a fronteira sem tratado"><rect x="4" y="4" width="140" height="122" rx="10" fill="#13233a" stroke="#5bb8c4"/><rect x="156" y="4" width="140" height="122" rx="10" fill="#13233a" stroke="#f2b63d"/><line x1="150" y1="8" x2="150" y2="122" stroke="#9fb0c6" stroke-dasharray="4 4"/>'+[20,45,70,95].map(function(y,i){return '<circle r="5" fill="#5bb8c4"><animate attributeName="cx" values="30;270;30" dur="'+(4+i)+'s" repeatCount="indefinite"/><animate attributeName="cy" values="'+y+';'+(y+8)+';'+y+'" dur="'+(4+i)+'s" repeatCount="indefinite"/></circle>'}).join('')+'<text x="150" y="122" font-size="9" fill="#9fb0c6" text-anchor="middle">sem tratado, o fluxo já existe</text></svg><figcaption>Ilustração: regionalização é o fluxo que cruza a fronteira, com ou sem acordo.</figcaption></figure>';
if(k==='stairs')return '<figure><svg viewBox="0 0 300 150" role="img" aria-label="Ilustração: degraus de Balassa">'+['Livre comércio','União aduaneira','Mercado comum','União econômica','Integração total'].map(function(n,i){return '<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="'+(i*.7)+'s" dur=".4s" fill="freeze"/><rect x="'+(8+i*56)+'" y="'+(110-i*24)+'" width="54" height="'+(34+i*24)+'" fill="'+['#5bb8c4','#4aa6b2','#f2b63d','#ef9a4f','#ef7a63'][i]+'" rx="4"/><text x="'+(35+i*56)+'" y="'+(130-i*24+10)+'" font-size="7.5" fill="#0b1522" text-anchor="middle" font-weight="700">'+n.split(' ')[0]+'</text></g>'}).join('')+'</svg><figcaption>Ilustração: cada degrau integra mais e cede mais soberania (Balassa, 1961).</figcaption></figure>';return ''}
function media(m){var h=anim(m.anim);
if(m.img&&M.IMG[m.img]){h+='<figure><img alt="" src="'+M.IMG[m.img].u+'"><figcaption>'+esc(M.IMG[m.img].cap)+'</figcaption></figure>'}
if(m.map&&m.map.n){var c=ci(),inb=c&&m.map.n.indexOf(c[1])>=0;h+='<figure>'+mapSvg(m.map.n)+'</figure><div class="lg"><span><i style="background:#5bb8c4"></i>'+esc(m.title)+'</span><span><i style="background:#f2b63d"></i>seu país</span></div>'+(c?'<div class="you"><b>'+esc(c[0])+'</b> '+(inb?'é membro deste bloco.':'não é membro deste bloco.')+'</div>':'')}
return h}
function roleBox(){return role?'<div class="role"><b>Você é a delegação: '+esc(role.name)+'</b><span>'+esc(role.interest)+'</span></div>':''}
function picker(m){var c=ci();return '<div class="role"><b>'+esc(c?c[0]:'Seu país')+' não vota no Conselho da UE</b><span>Escolha uma delegação da UE para representar nesta votação.</span></div>'+(m.roles||[]).map(function(r,i){return '<button class="o" data-r="'+i+'"><b>'+(i+1)+'</b><span>'+esc(r.n)+'</span></button>'}).join('')}
function draw(){if(!cur)return;var m=cur,left=Math.max(0,Math.round((endAt-Date.now())/1000)),h='';
var hd=tg(m.tag)+'<p class="st">'+esc(m.name||'')+'</p><h1>'+esc(m.title||'')+'</h1>'+media(m)+(m.text?'<p class="tx">'+esc(m.text)+'</p>':'')+(m.hyp?'<p class="hyp"><b>Hipótese.</b> '+esc(m.hyp)+'</p>':'');
if(m.t==='cq'&&!role){view(hd+'<div class="q">'+esc(m.q||'')+'</div>'+picker(m));bindR();return}
var head2=hd+(m.t==='cq'?roleBox():'')+'<div class="q">'+esc(m.q||'')+'</div>'+(m.rule?'<p class="st">'+esc(m.rule)+'</p>':'');
if(m.t==='sl'){h=head2+'<div class="sl"><div class="sv" id="sv">'+(mine===null?'5':mine)+'</div><input type="range" id="rg" min="0" max="10" step="1" value="'+(mine===null?5:mine)+'"'+(m.locked?' disabled':'')+'><div class="lh"><span>'+esc(m.lo)+'</span><span>'+esc(m.hi)+'</span></div></div>'}
else{h=head2+m.opts.map(function(o,k){return '<button class="o'+(mine===k?' sel':'')+'" data-k="'+k+'"'+(m.locked?' disabled':'')+'><b>'+(k+1)+'</b><span>'+esc(o)+'</span></button>'}).join('')}
h+='<p class="st" id="info">'+(m.locked?'Votação encerrada. Aguarde.':(mine===null?'Tempo: <span class="t" id="tt">'+left+'s</span>':'Resposta enviada. Você pode mudar até o tempo acabar. <span class="t" id="tt">'+left+'s</span>'))+'</p>';
view(h);
Array.prototype.forEach.call(app.querySelectorAll('button.o'),function(b){b.addEventListener('click',function(){if(!cur||cur.locked||!alive)return;mine=+b.getAttribute('data-k');tx({t:'vote',key:cur.key,k:mine});draw()})});
var rg=document.getElementById('rg');if(rg){var tm=null;rg.addEventListener('input',function(){document.getElementById('sv').textContent=rg.value;mine=+rg.value;clearTimeout(tm);tm=setTimeout(function(){if(cur&&!cur.locked&&alive){tx({t:'vote',key:cur.key,k:mine});var i=document.getElementById('info');if(i)i.textContent='Resposta enviada. Você pode mudar até o tempo acabar.'}},250)})}}
function bindR(){Array.prototype.forEach.call(app.querySelectorAll('button[data-r]'),function(b){b.addEventListener('click',function(){if(!alive)return;tx({t:'role',i:+b.getAttribute('data-r')})})})}
setInterval(function(){var tt=document.getElementById('tt');if(tt&&cur&&!cur.locked){tt.textContent=Math.max(0,Math.round((endAt-Date.now())/1000))+'s'}},500);
function showFun(m){var f=document.getElementById('fun');f.hidden=false;f.className='fun';f.innerHTML='<div class="c"><div class="stk">'+esc(m.emo||'👋')+'</div><p>'+esc(m.text||'')+'</p>'+(m.btn?'<button id="fb">'+esc(m.btn)+'</button>':'<button id="fb">Ok</button>')+'</div>';
function close(){f.hidden=true;f.className='';f.innerHTML='';clearTimeout(funT)}
document.getElementById('fb').addEventListener('click',function(){if(m.btn)tx({t:'rx',e:'p'});close()});clearTimeout(funT);funT=setTimeout(close,20000)}
Array.prototype.forEach.call(document.querySelectorAll('#rxb button'),function(b){var lt=0;b.addEventListener('click',function(){var n=Date.now();if(n-lt<700||!alive)return;lt=n;tx({t:'rx',e:b.getAttribute('data-e')})})});
function chooseScreen(){cur=null;view('<h1>Escolha o país que você representa</h1><p class="st">Ele será o seu país até o fim da aula, nas simulações e nos mapas.</p><div class="pg">'+CT.map(function(c,i){return '<button class="c'+(pick===i?' sel':'')+'" data-i="'+i+'"><b>'+esc(c[0])+'</b><span>'+esc(c[2])+'</span></button>'}).join('')+'</div><button class="go" id="go"'+(pick===null?' disabled':'')+'>Entrar na aula</button>');
Array.prototype.forEach.call(app.querySelectorAll('button.c'),function(b){b.addEventListener('click',function(){pick=+b.getAttribute('data-i');chooseScreen()})});
var g=document.getElementById('go');if(g)g.addEventListener('click',function(){if(pick===null)return;country=CT[pick][0];try{localStorage.setItem('rg_country',country)}catch(e){}if(alive)tx({t:'hello',c:country});if(last)onMsg(last);else msg('Você entrou como '+esc(country),'Aguarde a próxima etapa.')})}
function onMsg(m){if(!m||typeof m!=='object')return;
if(m.t==='role'){role={name:m.name,interest:m.interest};if(cur&&cur.t==='cq')draw();return}
if(m.t==='fun'){if(country){showFun(m);try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}return}
if(!country){if(m.t!=='lock'&&m.t!=='done')last=m;chooseScreen();return}
if(m.t==='q'||m.t==='cq'||m.t==='sl'){last=m;endAt=Date.now()+(m.left||0)*1000;m.locked=false;cur=m;mine=null;draw()}
else if(m.t==='lock'){if(cur&&cur.key===m.key){cur.locked=true;draw()}}
else if(m.t==='done'){if(cur&&cur.key===m.key){cur.locked=true;var o=m.txt||(cur.opts&&cur.opts[m.k])||'';var same=(m.k!==null&&m.k!==undefined&&mine===m.k);var rev=m.head==='Resposta',noans=(m.k===null||m.k===undefined);var tot=(m.res||[]).reduce(function(a,b){return a+b},0);var rs=(m.res&&tot)?'<div class="box">'+(cur.opts||[]).map(function(op,i){var pc=Math.round(m.res[i]*100/tot);return '<p class="tx" style="margin:.2rem 0"><b style="color:'+(!noans&&i===m.k?'var(--amber)':'var(--teal)')+'">'+pc+'%</b> '+esc(op)+(!noans&&i===m.k?' ✓':'')+(mine===i?' (você)':'')+'</p>'}).join('')+'</div>':'';
if(rev&&!noans&&same){try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}}
view('<p class="st">'+esc(cur.name||'')+'</p>'+(rev&&!noans&&same?'<div class="win">🎉</div>':'')+'<h1>'+esc(m.head||'Decisão da turma')+'</h1>'+(rev?'<p class="st">'+(mine===null?'Você não votou nesta etapa.':(noans?'Sua resposta foi registrada.':(same?'Você acertou.':'Você marcou outra opção.')))+'</p>'+rs+'<div class="box">'+esc(o)+'</div>':'<div class="box">'+esc(o)+'</div>'+(cur.t==='q'?'<p class="st">'+(mine===null?'Você não votou nesta etapa.':(same?'Você votou nessa opção.':'Você votou em outra opção.'))+'</p>':'')+rs)+'<p class="st">Aguarde a próxima etapa.</p>')}}
else if(m.t==='info'){last=m;cur=null;view(tg(m.tag)+'<h1>'+esc(m.title)+'</h1>'+media(m)+(m.text?'<div class="box">'+esc(m.text)+'</div>':''))}
else if(m.t==='prof'){last=null;cur=null;view('<div class="prof"><div class="k">Seu perfil na simulação</div><h2>'+esc(m.title)+'</h2><p style="margin:0">'+esc(m.text)+'</p><p class="st">Classificação didática, não é um teste psicológico. Tire um print para guardar.</p></div>'+(m.fact?'<span class="tag Fato">Fato</span><div class="box">'+esc(m.fact)+'</div>':''))}
else if(m.t==='wait'){last=m;msg('Conectado','Aguardando a próxima etapa.')}
else if(m.t==='end'){last=null;cur=null;view('<h1>Simulação concluída</h1><div class="box">'+esc(m.title||'')+'</div><p class="st">Acompanhe o resultado na tela da aula.</p>')}}
function connect(){if(!host){msg('Link incompleto','Use o QR code exibido na aula.');return}
if(typeof Peer==='undefined'){msg('Sem conexão','Recarregue a página.');return}
var opts=ph?{host:ph,port:+pp||9000,path:'/',secure:false}:{};
peer=new Peer(opts);
peer.on('open',function(){open_()});
peer.on('error',function(e){alive=false;msg('Sem conexão com a aula','Tentando de novo...');setTimeout(retry,2500)});
peer.on('disconnected',function(){alive=false;setTimeout(function(){try{peer.reconnect()}catch(e){}},1500)})}
function open_(){conn=peer.connect(host,{reliable:true});
conn.on('open',function(){alive=true;if(country)tx({t:'hello',c:country});if(!country)chooseScreen();else{document.getElementById('rxb').hidden=false;if(!cur&&!last)msg('Você entrou como '+esc(country),'Aguarde a próxima etapa.')}});
conn.on('data',onMsg);
conn.on('close',function(){alive=false;msg('Conexão perdida','Tentando reconectar...');setTimeout(function(){if(peer&&!peer.destroyed&&!peer.disconnected)open_();else retry()},2000)});
conn.on('error',function(){});
setTimeout(function(){if(!alive&&conn&&!conn.open){try{conn.close()}catch(e){}}},12000)}
function retry(){try{peer&&peer.destroy()}catch(e){}connect()}
connect()})();
</script></body></html>
